<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c30" />
      <stop offset="100%" stop-color="#0a0c16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#grad)" stroke-width="2.5" />
  
  <!-- Stylized M -->
  <path d="M18 44V20L32 33L46 20V44" fill="none" stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Subtle accent dot -->
  <circle cx="46" cy="44" r="2.75" fill="#38bdf8" />
</svg>
